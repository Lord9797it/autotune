name: Build LowLatTune (Windows)

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: LowLatTune
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: LowLatTune-VST3-Windows
          path: LowLatTune/build/LowLatTune_artefacts/Release/VST3/
  
